<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Плани поїздок</title>
<style>
:root {
  --bg: #f3f6f7; --surface: #ffffff; --fg: #14282e; --muted: #5a6e74; --line: #d6e0e3;
  --accent: #0b6e7a; --accent-soft: #dcf0f2;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1b1f; --surface: #162429; --fg: #e4eef0; --muted: #94a9af; --line: #29393e;
    --accent: #5cc4d0; --accent-soft: #17383d;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }

#list { padding: 14px max(14px, env(safe-area-inset-right)) 28px max(14px, env(safe-area-inset-left)); max-width: 760px; margin: 0 auto; }
#list h2 { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
#list h2:first-child { margin-top: 4px; }
.card { display: block; padding: 14px 16px; margin-bottom: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; color: var(--fg); text-decoration: none; font-weight: 600; }
.card:hover, .card:focus-visible { border-color: var(--accent); background: var(--accent-soft); outline: none; }
.card small { display: block; color: var(--muted); font-weight: 400; font-size: .85rem; margin-top: 2px; }

#viewer { background: var(--bg); }
#viewer[hidden] { display: none; }
.vbar { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 10px; height: 44px; flex: none; padding: 0 10px; padding-top: env(safe-area-inset-top); background: var(--surface); border-bottom: 1px solid var(--line); }
.vbar button { font: inherit; font-weight: 600; color: var(--accent); background: none; border: 0; padding: 8px 10px; margin-left: -6px; cursor: pointer; border-radius: 8px; }
.vbar button:hover, .vbar button:focus-visible { background: var(--accent-soft); outline: none; }
.vbar a { margin-left: auto; flex: none; color: var(--accent); font-weight: 600; font-size: .9rem; text-decoration: none; padding: 8px 10px; margin-right: -6px; border-radius: 8px; white-space: nowrap; }
.vbar a:hover, .vbar a:focus-visible { background: var(--accent-soft); outline: none; }
.vbar span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
#frame { display: block; width: 100%; height: 600px; border: 0; background: #fff; }
</style>
</head>
<body>
<div id="list">
  <h2>Поїздки</h2>
  <a class="card" href="trip_plan/2026.12_trip-oman.html" data-title="Оман — план поїздки">Оман<small>30.12.2026 – 08.01.2027, з Загреба</small></a>
  <a class="card" href="trip_plan/2026.11_trip-austria-germany.html" data-title="Австрія та Німеччина">Австрія та Німеччина<small>листопад 2026</small></a>
  <h2>Перельоти</h2>
  <a class="card" href="flights/2027.01_oman_day_trip_flights.html" data-title="Одноденна поїздка з Маската: Кувейт, Бахрейн, Доха">Маскат: Кувейт, Бахрейн, Доха<small>3-7.01.2027, порівняння, всі рейси по напрямках</small></a>
  <a class="card" href="flights/2026.12_christmas_flights_open_return.html" data-title="Виліт 24-30.12.2026, повернення до 18.01.2027">Виліт 24-30.12, назад до 18.01<small>7 напрямків, 6 міст, найдешевша пара</small></a>
  <a class="card" href="flights/2026.11_flight_plans.html" data-title="Відень - Бангкок (листопад 2026)">Відень - Бангкок<small>попередній план, листопад 2026</small></a>
</div>
<div id="viewer" hidden>
  <div class="vbar"><button type="button" id="back" aria-label="Назад до списку планів">&larr; Плани</button><span id="vtitle"></span><a id="open" target="_blank" rel="noopener">Окремо &#8599;</a></div>
  <iframe id="frame" title="План" scrolling="no"></iframe>
</div>
<script>
(function () {
  var cards = document.querySelectorAll('#list a.card');
  var list = document.getElementById('list');
  var viewer = document.getElementById('viewer');
  var frame = document.getElementById('frame');
  var vtitle = document.getElementById('vtitle');
  var openLink = document.getElementById('open');

  function findCard(href) {
    for (var i = 0; i < cards.length; i++) {
      if (cards[i].getAttribute('href') === href) { return cards[i]; }
    }
    return null;
  }

  function render() {
    var href = '';
    try { href = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
    var card = href ? findCard(href) : null;
    if (card) {
      list.hidden = true;
      viewer.hidden = false;
      vtitle.textContent = card.getAttribute('data-title');
      openLink.setAttribute('href', href);
      if (frame.getAttribute('src') !== href) { frame.setAttribute('src', href); }
    } else {
      viewer.hidden = true;
      list.hidden = false;
      frame.removeAttribute('src');
    }
  }

  for (var i = 0; i < cards.length; i++) {
    cards[i].addEventListener('click', function (e) {
      e.preventDefault();
      location.hash = this.getAttribute('href');
    });
  }

  document.getElementById('back').addEventListener('click', function () {
    if (window.history.length > 1) { window.history.back(); }
    else { location.hash = ''; }
  });

  function fit() {
    if (viewer.hidden) { return; }
    try {
      var d = frame.contentDocument;
      if (!d || !d.documentElement) { return; }
      var h = Math.max(d.documentElement.scrollHeight, d.body ? d.body.scrollHeight : 0);
      if (h > 0 && Math.abs(frame.offsetHeight - h) > 1) { frame.style.height = h + 'px'; }
    } catch (e) {}
  }
  frame.addEventListener('load', fit);
  window.addEventListener('resize', fit);
  setInterval(fit, 400);

  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
